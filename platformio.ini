; Felicity battery local monitor on ESP32 Cheap Yellow Display (CYD)
; Standard CYD model: ESP32-2432S028R (ILI9341, resistive touch)
;
; All TFT_eSPI pins are passed as build flags - no need to edit
; User_Setup.h in the library folder.

[env:cyd]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    ; --- TFT_eSPI driver config for CYD (ESP32-2432S028R) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    ; --- App config ---
    -DCORE_DEBUG_LEVEL=2

build_unflags =
    -std=gnu++11

build_flags_extra =
    -std=gnu++17
