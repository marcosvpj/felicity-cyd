name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "API/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o cydsolar-api .
      - run: cp deploy/cydsolar-outlook.service deploy/cydsolar-outlook.timer .
      - uses: actions/upload-artifact@v4
        with:
          name: cydsolar-api-deploy
          path: |
            API/cydsolar-api
            API/cydsolar-outlook.service
            API/cydsolar-outlook.timer
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cydsolar-api-deploy
          path: dist

      - name: Copy binary + systemd units to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/cydsolar-api,dist/cydsolar-outlook.service,dist/cydsolar-outlook.timer"
          target: /tmp/cydsolar-deploy
          strip_components: 1

      - name: Bootstrap (idempotent) + install binary + units, restart timer, run once
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            id -u cydsolar >/dev/null 2>&1 || useradd --system --no-create-home cydsolar
            mkdir -p /opt/cydsolar-api /var/www/dashboard-solar
            install -o cydsolar -g cydsolar -m 755 \
              /tmp/cydsolar-deploy/cydsolar-api /opt/cydsolar-api/cydsolar-api
            chown -R cydsolar:cydsolar /opt/cydsolar-api /var/www/dashboard-solar
            cp /tmp/cydsolar-deploy/cydsolar-outlook.service \
              /tmp/cydsolar-deploy/cydsolar-outlook.timer /etc/systemd/system/
            rm -rf /tmp/cydsolar-deploy
            systemctl daemon-reload
            systemctl enable --now cydsolar-outlook.timer
            systemctl start cydsolar-outlook.service
